<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PATHtoIP Marketing Dashboard</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--bd:#e3e6ee;--ac:#0a4fcf;--ac2:#e8f0ff;--ok:#16a34a;--wr:#d97706;--er:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#181c26;--tx:#e8eaf0;--mu:#9aa3b2;--bd:#2a3040;--ac:#818cf8;--ac2:#232845;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131a;--card:#181c26;--tx:#e8eaf0;--mu:#9aa3b2;--bd:#2a3040;--ac:#818cf8;--ac2:#232845;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:18px;margin:0}h1 span{color:var(--ac)}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--tx)}
.tab,.btn{border:1px solid var(--bd);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer}
.tab.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
main{padding:18px 20px;max-width:1200px;margin:auto}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.card h3{margin:0 0 10px;font-size:14px}
.stat b{font-size:26px;display:block}.stat small,.mu{color:var(--mu)}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;color:#fff;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row .t{flex:1;min-width:0}.row .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%}
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--ac2);border-radius:12px;padding:8px;min-height:160px}.col h4{margin:4px 6px 8px;font-size:12px;text-transform:uppercase;color:var(--mu)}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{font-size:11px;color:var(--mu);text-align:center}
.day{min-height:92px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px;overflow:hidden;cursor:pointer}.day.o{opacity:.45}.day.td{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.day .n{font-size:11px;color:var(--mu)}.ev{font-size:11px;color:#fff;border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.ov.on{display:flex}
.modal{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.modal label{display:block;font-size:12px;color:var(--mu);margin-top:10px}
.modal input,.modal select,.modal textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alert{background:#fef3c7;color:#78350f;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bad{color:var(--er)}.empty{padding:20px;text-align:center;color:var(--mu)}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.fl select,.fl input{padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:9px;display:none;z-index:30}
.drop{border:2px dashed var(--bd);border-radius:10px;padding:16px;text-align:center;margin-top:10px}code{background:var(--ac2);padding:1px 5px;border-radius:5px;font-size:12px}</style>

<script>
const CH={Blog:'#0ea5e9',Instagram:'#d946ef',LinkedIn:'#0a66c2',Facebook:'#2563eb',X:'#374151',Pinterest:'#e11d48',YouTube:'#dc2626','Google Business':'#16a34a',SEO:'#ca8a04',Reviews:'#f59e0b','Feedback Form':'#0d9488','Email/Newsletter':'#7c3aed',WhatsApp:'#22c55e',Medium:'#111827',Quora:'#b91c1c','PR/Media':'#9333ea',Events:'#ea580c',Website:'#0891b2'};
const CORE=['Blog','Instagram','LinkedIn','Facebook','X','Pinterest'];
const hc=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h},55%,42%)`};
const col=c=>CH[c]||hc(c||'?');
const allCh=()=>[...new Set([...Object.keys(CH),...tasks.map(t=>t.channel).filter(Boolean)])];
const ST=['Idea','Drafting','Review','Scheduled','Published'];
const TY=['Blog post','Reel','Carousel','Post','Article','Thread','Pin','Story','Video','Newsletter','SEO task','Keyword research','On-page fix','Backlink','GBP post','GBP update','Review request','Review reply','Feedback form','Survey follow-up','Audit','Other'];
let tasks=[],view='dash',cur=new Date(),store,mode='local';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pd=t=>t.due?new Date(t.due):null;
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=d=>d?d.toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'No date';
const chip=c=>`<span class="chip" style="background:${col(c)}">${esc(c)}</span>`;
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m,undo){const t=$('#toast');t.textContent=m;if(undo){const b=document.createElement('button');b.textContent='Undo';b.style.cssText='margin-left:12px;padding:2px 10px;border-radius:6px;border:0;cursor:pointer;background:#fff;color:#111;font-weight:600';b.onclick=()=>{undo();t.style.display='none'};t.appendChild(b)}t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',undo?7000:2600)}
const isOver=t=>t.status!=='Published'&&pd(t)&&pd(t)<new Date();
const isSoon=t=>t.status!=='Published'&&pd(t)&&pd(t)>=new Date()&&pd(t)-new Date()<864e5;

/* ---- storage: client-side AES-GCM encryption (key from team passphrase via PBKDF2). Only ciphertext is stored. ---- */
let KEY=null,locked=true,unsub=null,META,raw,lastAct=Date.now();
const b64=b=>{let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(o){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify(o)));return{iv:b64(iv),c:b64(ct)}}
async function dec(r){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(r.iv)},KEY,ub64(r.c))))}
function localRaw(){const K='pathtoip_enc',M='pathtoip_meta';const ld=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return{}}};const sv=o=>{try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}};
  const R={cb:null,async meta(){try{return JSON.parse(localStorage.getItem(M)||'null')}catch(e){return null}},async setMeta(m){try{localStorage.setItem(M,JSON.stringify(m))}catch(e){}},
  sub(cb){R.cb=cb;cb(Object.entries(ld()).map(([id,v])=>({id,...v})))},async put(id,r){const o=ld();o[id]=r;sv(o);R.sub(R.cb)},async del(id){const o=ld();delete o[id];sv(o);R.sub(R.cb)}};
  const LK='pathtoip_led',ldl=()=>{try{return JSON.parse(localStorage.getItem(LK)||'{}')}catch(e){return{}}},svl=o=>{try{localStorage.setItem(LK,JSON.stringify(o))}catch(e){}};

/* ---- founder layer: separate passphrase + RSA-OAEP-encrypted completion ledger readable only with the founder key ---- */
let PUB=null,FPRIV=null,FMETA,led=[],ledUnsub=null;
const RSA={name:'RSA-OAEP',hash:'SHA-256'};
async function loadPub(){try{FMETA=await raw.fmeta();PUB=FMETA?await crypto.subtle.importKey('spki',ub64(FMETA.pub),RSA,false,['encrypt']):null}catch(e){FMETA=null;PUB=null}}
async function ledgerSync(t){if(!PUB)return;try{
  if(t.status==='Published'){const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12));
    const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify({id:t.id,title:t.title,channel:t.channel,owner:t.owner,link:t.link,doneAt:t.doneAt||t.due||new Date().toISOString()})));
    const ek=await crypto.subtle.encrypt({name:'RSA-OAEP'},PUB,await crypto.subtle.exportKey('raw',k));await raw.ledPut(t.id,{ek:b64(ek),iv:b64(iv),c:b64(c)})}
  else await raw.ledDel(t.id)}catch(e){}}
async function founderSetup(pw){
  const kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:3072,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
  const salt=crypto.getRandomValues(new Uint8Array(16)),wk=await derive(pw,salt),iv=crypto.getRandomValues(new Uint8Array(12));
  const w=await crypto.subtle.encrypt({name:'AES-GCM',iv},wk,await crypto.subtle.exportKey('pkcs8',kp.privateKey));
  await raw.setFmeta({salt:b64(salt),pub:b64(await crypto.subtle.exportKey('spki',kp.publicKey)),wiv:b64(iv),w:b64(w)});
  await loadPub();for(const t of tasks.filter(t=>t.status==='Published'))await ledgerSync(t);FPRIV=kp.privateKey;await openLedger()}
async function founderUnlock(pw){
  const wk=await derive(pw,ub64(FMETA.salt)),pk=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(FMETA.wiv)},wk,ub64(FMETA.w));
  FPRIV=await crypto.subtle.importKey('pkcs8',pk,RSA,false,['decrypt']);await openLedger()}
async function openLedger(){lastAct=Date.now();if(ledUnsub)ledUnsub();
  ledUnsub=raw.ledSub(async rows=>{const out=[];for(const r of rows){try{const k=await crypto.subtle.importKey('raw',await crypto.subtle.decrypt({name:'RSA-OAEP'},FPRIV,ub64(r.ek)),'AES-GCM',false,['decrypt']);
    out.push(JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(r.iv)},k,ub64(r.c)))))}catch(e){}}led=out;if(view==='founder')render()})||null;render()}
function founderLock(){FPRIV=null;led=[];if(ledUnsub)ledUnsub();ledUnsub=null;render()}
function founderGate(){const first=!FMETA,st='style="width:100%;padding:9px;margin-top:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)"';
  setTimeout(()=>{const b=$('#fgo');if(!b)return;const go=async()=>{const pw=$('#fpw').value,er=$('#ferr');er.textContent='';
    try{if(first){if(pw.length<12){er.textContent='Use at least 12 characters';return}if(pw!==$('#fpw2').value){er.textContent='Passphrases do not match';return}er.textContent='Generating keys…';await founderSetup(pw)}else await founderUnlock(pw)}

  const owners=[...new Set(tasks.map(t=>t.owner).filter(Boolean))];
  const a=tasks.filter(t=>(!F.ch||t.channel===F.ch)&&(!F.st||t.status===F.st)&&(!F.ow||t.owner===F.ow)&&(!F.q||t.title.toLowerCase().includes(F.q.toLowerCase()))).sort((x,y)=>(x.due||'z')<(y.due||'z')?-1:1);
  const op=(arr,v)=>`<option value="">All</option>`+arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  setTimeout(()=>{[['fch','ch'],['fst','st'],['fow','ow']].forEach(([id,k])=>$('#'+id).onchange=e=>{F[k]=e.target.value;render()});$('#fq').oninput=e=>{F.q=e.target.value;render();const i=$('#fq');i.focus();i.setSelectionRange(99,99)};
    const r=$('#remall');if(r)r.onclick=()=>{[...tasks.filter(t=>isOver(t)||isSoon(t))].forEach(t=>remind(t.id,true));toast('Reminder drafts opened for due/overdue items')};
    document.querySelectorAll('[data-rem]').forEach(b=>b.onclick=e=>{e.stopPropagation();remind(b.dataset.rem)});
    document.querySelectorAll('[data-done]').forEach(b=>b.onclick=e=>{e.stopPropagation();markDone(b.dataset.done)})});
  return`<div class="fl"><select id="fch">${op(allCh(),F.ch)}</select><select id="fst">${op(ST,F.st)}</select><select id="fow">${op(owners,F.ow)}</select><input id="fq" placeholder="Search…" value="${esc(F.q)}"><button class="btn sm" id="remall">📨 Remind all due/overdue</button></div><div class="card">${a.map(t=>`<div class="row" data-open="${t.id}" style="cursor:pointer"><div class="t"><div><b>${esc(t.title)}</b> <span class="mu">· ${esc(t.type||'')}</span></div><div class="${isOver(t)?'bad':'mu'}">${fmt(pd(t))}${isOver(t)?' · OVERDUE':''} · ${esc(t.owner||'Unassigned')} · ${esc(t.status)}${t.reviewState?' · 👀 '+esc(t.reviewState)+(t.reviewer?' ('+esc(t.reviewer)+')':''):''}</div></div>${chip(t.channel)}${t.reviewState==='Pending'?`<button class="btn sm" data-rr2="${t.id}" title="Remind reviewer">👀 Remind reviewer</button>`:''}<button class="btn sm" data-rem="${t.id}" title="Send reminder">🔔 Remind</button>${t.status!=='Published'?`<button class="btn sm" data-done="${t.id}" title="Mark as posted">✓ Posted</button>`:`<button class="btn sm" data-reopen="${t.id}" title="Move back to Drafting">↩ Reopen</button>`}</div>`).join('')||'<div class="empty">No matching activities.</div>'}</div>`}
function bindV(){document.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>{view=e.dataset.v;render()})}
document.addEventListener('click',e=>{const v=e.target.closest('[data-v]');if(v){if(view==='founder'&&v.dataset.v!=='founder')founderLock();view=v.dataset.v;render()}});

/* ---- modal ---- */
function edit(id,due,ch){if(locked)return;
  const t=id?tasks.find(x=>x.id===id):{title:'',channel:ch||'LinkedIn',type:'Post',status:'Idea',due:due||'',owner:'',email:'',notes:'',link:''};
  const o=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
  $('#modal').innerHTML=`<h3 style="margin:0">${id?'Edit':'New'} activity</h3>
  <label>Title</label><input id="m_title" value="${esc(t.title)}" placeholder="e.g. Blog: FTO basics for startups">
  <div class="two"><div><label>Channel / activity area</label><select id="m_ch">${o(allCh(),t.channel)}<option value="__new">➕ New channel…</option></select><input id="m_chn" placeholder="New channel name" style="display:none;margin-top:6px"></div><div><label>Format</label><select id="m_ty">${o([...new Set([...TY,t.type].filter(Boolean))],t.type)}</select></div></div>
  <div class="two"><div><label>Publish date & time</label><input type="datetime-local" id="m_due" value="${esc(t.due)}"></div><div><label>Status</label><select id="m_st">${o(ST,t.status)}</select></div></div>
  <div class="two"><div><label>Owner</label><input id="m_ow" value="${esc(t.owner)}" placeholder="Name"></div><div><label>Owner email (for reminders)</label><input id="m_em" type="email" value="${esc(t.email)}"></div></div>
  <div class="two"><div><label>Reviewer (founder / anyone)</label><input id="m_rv" value="${esc(t.reviewer)}" placeholder="Name"></div><div><label>Reviewer email</label><input id="m_rve" type="email" value="${esc(t.reviewerEmail)}"></div></div><label>Review needed by</label><input type="datetime-local" id="m_rd" value="${esc(t.reviewDue)}">${t.reviewState?`<div class="mu" style="margin-top:6px">Review status: <b>${esc(t.reviewState)}</b>${t.reviewNote?' — '+esc(t.reviewNote):''}</div>`:''}
  <label>Link / asset (Canva, Drive, live URL)</label><input id="m_ln" value="${esc(t.link)}">
  <label>Notes / caption / brief</label><textarea id="m_nt" rows="3">${esc(t.notes)}</textarea>
  <div class="fl" style="margin:14px 0 0;justify-content:space-between"><div>${id?'<button class="btn" id="m_del">Delete</button>':''}</div><div class="fl" style="margin:0"><button class="btn" id="m_x">Cancel</button><button class="btn" id="m_rv2">📨 Send for review</button><button class="btn pri" id="m_ok">Save</button></div></div>`;
  $('#ov').classList.add('on');
  $('#m_x').onclick=()=>$('#ov').classList.remove('on');
  $('#m_ch').onchange=e=>{$('#m_chn').style.display=e.target.value==='__new'?'block':'none'};
  $('#m_rv2').onclick=()=>{const title=$('#m_title').value.trim(),rv=$('#m_rv').value.trim();if(!title||!rv){toast('Add a title and a reviewer first');return}
    let chv=$('#m_ch').value;if(chv==='__new')chv=$('#m_chn').value.trim()||'Other';
    const o={...t,id:t.id||uid(),title,channel:chv,type:$('#m_ty').value,due:$('#m_due').value,owner:$('#m_ow').value.trim(),email:$('#m_em').value.trim(),link:$('#m_ln').value.trim(),notes:$('#m_nt').value,reviewer:rv,reviewerEmail:$('#m_rve').value.trim(),reviewDue:$('#m_rd').value,status:'Review',doneAt:'',reviewState:'Pending',reviewNote:''};
    store.save(o);$('#ov').classList.remove('on');remindReview(o)};
  if(id)$('#m_del').onclick=e=>{const b=e.currentTarget;if(b.dataset.arm){store.del(id);$('#ov').classList.remove('on');toast('Activity deleted');return}b.dataset.arm='1';b.textContent='Tap again to confirm';b.style.cssText='background:var(--er);border-color:var(--er);color:#fff';setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='Delete';b.style.cssText=''}},4000)};
  $('#m_ok').onclick=()=>{const title=$('#m_title').value.trim();if(!title){toast('Title required');return}
    let chv=$('#m_ch').value;if(chv==='__new')chv=$('#m_chn').value.trim();if(!chv){toast('Enter a channel name');return}
    store.save({id:t.id||uid(),title,channel:chv,type:$('#m_ty').value,due:$('#m_due').value,status:$('#m_st').value,doneAt:$('#m_st').value==='Published'?(t.doneAt||new Date().toISOString()):'',owner:$('#m_ow').value.trim(),email:$('#m_em').value.trim(),link:$('#m_ln').value.trim(),notes:$('#m_nt').value,reviewer:$('#m_rv').value.trim(),reviewerEmail:$('#m_rve').value.trim(),reviewDue:$('#m_rd').value,reviewState:t.reviewState||'',reviewNote:t.reviewNote||''});$('#ov').classList.remove('on')}}
$('#add').onclick=()=>edit();
$('#ov').onclick=e=>{if(e.target.id==='ov')e.target.classList.remove('on')};

/* ---- reminders ---- */
function remind(id,quiet){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const subj=`Reminder: ${t.channel} – ${t.title} (${fmt(pd(t))})`;
  const body=`Hi ${t.owner||'team'},\n\nFriendly reminder from the PATHtoIP marketing hub:\n\n• Activity: ${t.title}\n• Channel: ${t.channel} (${t.type||''})\n• Due: ${fmt(pd(t))}\n• Status: ${t.status}\n${t.link?'• Asset: '+t.link+'\n':''}${t.notes?'\nBrief: '+t.notes+'\n':''}\nPlease update the status once done.\n\nThanks!`;
  if(t.email){window.open('mailto:'+encodeURIComponent(t.email)+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body),'_blank')}
  else{try{navigator.clipboard.writeText(subj+'\n\n'+body);if(!quiet)toast('No email set – reminder text copied to clipboard')}catch(e){toast('Add owner email to send reminders')}}}
$('#bell').onclick=async()=>{try{const p=await Notification.requestPermission();toast(p==='granted'?'Browser alerts on (while this tab is open)':'Alerts blocked in browser')}catch(e){toast('Alerts not supported here')}};
const notified=new Set();
setInterval(()=>{tasks.filter(t=>isSoon(t)&&pd(t)-new Date()<36e5&&!notified.has(t.id)).forEach(t=>{notified.add(t.id);toast('⏰ Due within 1h: '+t.title);try{if(Notification.permission==='granted')new Notification('Due soon: '+t.title,{body:t.channel+' · '+fmt(pd(t))})}catch(e){}})},60000);

/* ---- import / export ---- */
const COLS=['Title','Channel','Format','Date','Time','Status','Owner','Email','Link','Notes'];
async function saveFile(name,data){try{const dl=await claude.use('downloads');if(!dl){toast('Downloads unavailable here');return}await dl.save({filename:name,data});toast('File ready')}catch(e){toast('Download cancelled or blocked')}}
const csvq=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
$('#exp').onclick=()=>{const r=[COLS.join(',')].concat(tasks.map(t=>{const d=t.due||'';return[t.title,t.channel,t.type,d.slice(0,10),d.slice(11,16),t.status,t.owner,t.email,t.link,t.notes].map(csvq).join(',')}));saveFile('pathtoip-marketing-export.csv',r.join('\n'))};
$('#imp').onclick=()=>{
  $('#modal').innerHTML=`<h3 style="margin:0">Import from Excel / CSV</h3><p class="mu">First row must be headers. Columns (any order, case-insensitive): ${COLS.map(c=>'<code>'+c+'</code>').join(' ')}. Only <b>Title</b> is required. Channel can be any name (new channels are created automatically). Status: ${ST.join(', ')}.</p><div class="fl"><button class="btn sm" id="tpl">⬇ Download template</button></div><div class="drop"><input type="file" id="file" accept=".xlsx,.xls,.csv"><div class="mu" id="ipv" style="margin-top:8px">Choose a .xlsx, .xls or .csv file</div></div><div class="fl" style="margin:14px 0 0;justify-content:flex-end"><button class="btn" id="i_x">Close</button><button class="btn pri" id="i_ok" disabled>Import</button></div>`;
  $('#ov').classList.add('on');let rows=[];
  $('#i_x').onclick=()=>$('#ov').classList.remove('on');
  $('#tpl').onclick=()=>saveFile('pathtoip-marketing-template.csv',[COLS.join(','),['Blog: IP basics for startups','Blog','Blog post','2026-11-02','10:00','Idea','Asha','asha@example.com','',''].map(csvq).join(','),['Ask clients for Google reviews','Google Business','Review request','2026-11-04','11:00','Scheduled','Ravi','','',''].map(csvq).join(',')].join('\n'));
  $('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    if(typeof XLSX==='undefined'){$('#ipv').textContent='Excel reader failed to load. Save as CSV and try again, or check your connection.';return}
    try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true});
      const p=n=>String(n).padStart(2,'0');
      rows=raw.map(r=>{const g={};for(const k in r)g[k.trim().toLowerCase()]=r[k];
        const title=String(g.title||g.activity||g.task||'').trim();if(!title)return null;
        let dt=g.date||g['publish date']||g['due'],tm=g.time||'';let due='';
        if(dt){let d=dt instanceof Date?dt:new Date(dt);if(!isNaN(d)){let hh=d.getHours(),mm=d.getMinutes();
          if(tm instanceof Date){hh=tm.getHours();mm=tm.getMinutes()}else if(typeof tm==='number'&&tm<1){const m=Math.round(tm*1440);hh=Math.floor(m/60);mm=m%60}else if(/^\d{1,2}:\d{2}/.test(String(tm))){[hh,mm]=String(tm).split(':').map(Number)}else if(!(dt instanceof Date&&(hh||mm))){hh=10;mm=0}
          due=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(hh)}:${p(mm)}`}}
        const st=ST.find(s=>s.toLowerCase()===String(g.status||'').trim().toLowerCase())||'Idea';
        return{id:uid(),title,channel:String(g.channel||g.platform||'Other').trim()||'Other',type:String(g.format||g.type||'').trim(),due,status:st,owner:String(g.owner||g.assignee||'').trim(),email:String(g.email||'').trim(),link:String(g.link||'').trim(),notes:String(g.notes||'').trim()}}).filter(Boolean);
      $('#ipv').innerHTML=rows.length?`Found <b>${rows.length}</b> activities (${[...new Set(rows.map(r=>r.channel))].join(', ')})`:'No valid rows found – check the Title column.';$('#i_ok').disabled=!rows.length}
    catch(err){$('#ipv').textContent='Could not read this file.'}};
  $('#i_ok').onclick=async()=>{$('#i_ok').disabled=true;for(const r of rows)await store.save(r);$('#ov').classList.remove('on');toast('Imported '+rows.length+' activities')}};

/* ---- starter plan ---- */
function seed(){const base=new Date();base.setHours(10,0,0,0);
  const P=[['Blog: patent strategy explainer','Blog','Blog post',1],['Reel: IP myth-buster','Instagram','Reel',2],['LinkedIn: founder insight post','LinkedIn','Post',2],['Pin: IP infographic','Pinterest','Pin',3],['Facebook: client success note','Facebook','Post',4],['X thread: FTO in 6 tweets','X','Thread',5],['Carousel: trademark checklist','Instagram','Carousel',6],['Update Google Business profile posts & photos','Google Business','GBP post',2],['Send review requests to last month\'s clients','Reviews','Review request',3],['Send client feedback form','Feedback Form','Feedback form',4],['SEO: on-page fixes for top 5 pages','SEO','On-page fix',5],['SEO: keyword research for next blog','SEO','Keyword research',1]];
  P.forEach(([title,channel,type,d],i)=>{const x=new Date(base);x.setDate(x.getDate()+d);const p=n=>String(n).padStart(2,'0');
    store.save({id:uid()+i,title,channel,type,status:'Idea',owner:'',email:'',link:'',notes:'',due:`${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}T10:00`})})}
</script></body></html>
